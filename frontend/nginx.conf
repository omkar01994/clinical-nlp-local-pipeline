server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the FastAPI container (strips the /api prefix)
  location /api/ {
    proxy_pass http://app:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;   # the tone LLM is slow on CPU
  }

  location / {
    try_files $uri /index.html;
  }
}
