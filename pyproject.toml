[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-pipeline"
version = "0.1.0"
description = "Local medical Q&A: ClinicalBERT retrieval + local LLM for empathetic tone"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2", "transformers>=4.40", "numpy>=1.26", "httpx>=0.27",
  "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clinical-chat = "clinical_pipeline.cli:main"
clinical-build-index = "clinical_pipeline.indexer:main"
clinical-evaluate = "clinical_pipeline.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
